# Publish the workspace crates to crates.io on version tags using crates.io
# trusted publishing (OIDC), so no long-lived API token is stored in the repo.
#
# Ordering, resumability, and index propagation are handled by
# scripts/publish-crates.sh. See docs/releasing.md for the crate list and the
# one-time bootstrap that has to happen before trusted publishing works.

name: Publish crates.io

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-crates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Check release tag and bootstrap
    runs-on: ubuntu-latest
    steps:
      - name: Check bootstrap state
        run: |
          if ! curl --silent --show-error --fail --output /dev/null \
            -H 'User-Agent: gromnie-release (https://github.com/amoeba/gromnie)' \
            https://crates.io/api/v1/crates/gromnie-events; then
            echo "::error::gromnie-events is not on crates.io yet."
            echo "Trusted publishing cannot perform a crate's first publish."
            echo "Follow the bootstrap steps in docs/releasing.md."
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Verify tag matches every public crate version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          for crate in gromnie-events gromnie-scripting-api gromnie-client gromnie-scripting-host gromnie-runner gromnie-tui gromnie-cli; do
            version=$(cargo metadata --no-deps --format-version 1 | jq -r --arg crate "$crate" '.packages[] | select(.name == $crate) | .version')
            echo "$crate: tag=$tag_version manifest=$version"
            if [ "$tag_version" != "$version" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match ${crate} version ${version}"
              exit 1
            fi
          done

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [preflight, ci]
    # Must match the environment configured for each crate on crates.io.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: scripts/publish-crates.sh
