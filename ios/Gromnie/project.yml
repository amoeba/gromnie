name: Gromnie

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic

schemes:
  Gromnie:
    build:
      targets:
        Gromnie: all
        GromnieKit: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  # Swift wrapper around the generated `GromnieCore` C module. Views live in
  # the app target and only ever import this framework, never the C header.
  GromnieKit:
    type: framework
    platform: iOS
    sources:
      - path: Sources/GromnieKit
    dependencies:
      - framework: Frameworks/GromnieCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.gromnie.kit
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
    info:
      path: Support/GromnieKit/Info.plist
      properties:
        CFBundlePackageType: FMWK
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"

  Gromnie:
    type: application
    platform: iOS
    sources:
      - path: Sources/Gromnie
    dependencies:
      - target: GromnieKit
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.gromnie.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
    info:
      path: Support/Gromnie/Info.plist
      properties:
        CFBundleDisplayName: Gromnie
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: "Gromnie connects directly to game servers on your local network."