[package]
name = "gromnie-client"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "client library for gromnie"
repository.workspace = true
license.workspace = true

[lib]
name = "gromnie_client"
path = "src/lib.rs"

[features]
default = ["native"]
native = [
  "dep:crossterm",
  "dep:directories",
  "dep:ratatui",
  "dep:serenity",
  "dep:tracing-appender",
  "dep:wasmtime",
  "dep:wasmtime-wasi",
  "dep:wit-bindgen",
  "sockets",
]

# Sockets: tokio/net for UDP transport and DNS resolution, plus tokio/time
# for driver-loop deadlines and the headless facade. Both are native-only.
# Enabled by `native` and by gromnie-ios-bridge.
sockets = ["tokio/net", "tokio/time"]
wasm = ["dep:js-sys", "dep:web-sys", "dep:wasm-bindgen-futures", "gromnie-events/wasm"]

[dependencies]
asheron-rs.workspace = true
anyhow.workspace = true
bitflags = "2.6"
byteorder = "1.5.0"
js-sys = { version = "0.3", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = ["console"] }
chrono.workspace = true
clap.workspace = true
crossterm = { workspace = true, optional = true }
directories = { workspace = true, optional = true }
gromnie-events = { path = "../gromnie-events" }
rand = "0.8"
rand_isaac = "0.3"
ratatui = { workspace = true, optional = true }
serde = { version = "1.0", features = ["derive"] }
serenity = { workspace = true, optional = true }
strum_macros = "0.26.1"
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
toml = "0.8"
tracing.workspace = true
tracing-appender = { workspace = true, optional = true }
tracing-subscriber.workspace = true
wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }
wit-bindgen = { workspace = true, optional = true }

[dev-dependencies]
