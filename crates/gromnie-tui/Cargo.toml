[package]
name = "gromnie-tui"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "TUI game client for gromnie"
repository.workspace = true
license.workspace = true

[[bin]]
name = "tui"
path = "src/main.rs"

[dependencies]
asheron-rs.workspace = true
chrono.workspace = true
clap.workspace = true
crossterm.workspace = true
gromnie-client = { path = "../gromnie-client", version = "0.1.0" }
gromnie-events = { path = "../gromnie-events", version = "0.1.0" }
gromnie-runner = { path = "../gromnie-runner", version = "0.1.0" }
gromnie-scripting-host = { path = "../gromnie-scripting-host", version = "0.1.0", optional = true }
ratatui.workspace = true
textwrap = "0.16"
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["scripting"]
scripting = ["gromnie-scripting-host"]
