[package]
name = "gromnie"
autobins = false
default-run = "gromnie"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Command-driven Asheron's Call terminal client"
repository.workspace = true
license.workspace = true

[[bin]]
name = "gromnie"
path = "src/bin/gromnie.rs"

[dependencies]
asheron-rs.workspace = true
chrono.workspace = true
clap.workspace = true
crossterm.workspace = true
gromnie-client = { path = "../gromnie-client", version = "0.3.0" }
gromnie-events = { path = "../gromnie-events", version = "0.3.0" }
gromnie-runner = { path = "../gromnie-runner", version = "0.3.0" }
gromnie-scripting-host = { path = "../gromnie-scripting-host", version = "0.3.0", optional = true }
ratatui.workspace = true
textwrap = "0.16"
tempfile = "3"
toml.workspace = true
unicode-width = "0.2"
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["scripting"]
scripting = ["gromnie-scripting-host"]
